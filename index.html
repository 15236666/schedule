<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=2.0">
    <title>📷 阿阻档期</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f5efe0;
            --card-bg: #faf6ee;
            --card-inner: #fdfaf4;
            --border: #c4a66a;
            --text: #2c2416;
            --text-muted: #7a6a52;
            --gold: #b8963e;
            --gold-dark: #7a5c1e;
            --accent: #6b3a5b;
            --radius: 6px;
            --font-display: 'Cinzel Decorative', 'Georgia', serif;
            --font-body: 'Cormorant Garamond', 'Georgia', serif;
            --shadow-card: 0 4px 20px rgba(40,20,5,0.12);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: var(--font-body);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
            letter-spacing: 0.02em;
            /* 背景由 JS 动态设置，保留原有纹理 */
            background: var(--bg);
            background-image: radial-gradient(ellipse at 20% 10%, rgba(210,180,130,0.25) 0%, transparent 60%);
            background-attachment: fixed;
        }
        /* 背景图层 */
        #bgImageLayer {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
            background-size: cover;
            background-position: center;
            opacity: 0.3;
        }
        .main-container { width: 100%; max-width: 900px; position: relative; }
        .tarot-card {
            background: var(--card-bg);
            border: 3px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow-card);
            margin-bottom: 20px;
            position: relative;
        }
        .header {
            text-align: center;
            margin-bottom: 15px;
        }
        .header h1 {
            font-family: var(--font-display);
            font-size: 1.8rem;
            color: var(--text);
            letter-spacing: 0.05em;
        }
        .header .mystic { font-size: 1.5rem; color: var(--gold); }

        /* 顶部大时钟 + 排期区域 */
        .today-section {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
            align-items: center;
        }
        .today-clock-container {
            flex: 1 1 300px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .today-clock-container.reimbursed {
            opacity: 0.7;
        }
        .today-schedule {
            flex: 1 1 250px;
            max-height: 350px;
            overflow-y: auto;
            padding: 10px;
            background: var(--card-inner);
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }
        .today-schedule h3 {
            font-family: var(--font-display);
            margin-bottom: 10px;
            color: var(--gold-dark);
        }
        .slot-item {
            padding: 8px;
            margin: 5px 0;
            border-left: 4px solid;
            background: rgba(0,0,0,0.02);
            font-size: 0.9rem;
        }
        .reimbursed-badge {
            display: inline-block;
            background: #c44;
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.7rem;
            margin-left: 8px;
        }

        /* 下方日历 + 排期 */
        .bottom-section {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }
        .calendar-wrapper {
            flex: 0 0 70%;
            min-width: 300px;
        }
        .date-detail-panel {
            flex: 1 1 25%;
            min-width: 200px;
            background: var(--card-inner);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 10px;
            max-height: 500px;
            overflow-y: auto;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }
        .date-cell {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1;
            cursor: pointer;
            border-radius: 50%;
            background: var(--card-inner);
            border: 1px solid rgba(180,140,80,0.3);
            transition: opacity 0.2s;
        }
        .date-cell.today { border-color: var(--gold-dark); box-shadow: 0 0 10px rgba(180,140,60,0.3); }
        .date-cell.reimbursed { opacity: 0.7; }
        .date-cell canvas { position: absolute; top:0; left:0; width:100%; height:100%; pointer-events: none; }
        .date-number {
            position: relative;
            z-index: 2;
            font-family: var(--font-display);
            font-weight: 700;
            font-size: clamp(0.7rem, 2vw, 1.1rem);
        }
        /* 管理相关 */
        .admin-toggle { text-align: center; margin-top: 15px; }
        .admin-toggle a, .admin-toggle button { color: var(--text-muted); cursor: pointer; margin: 0 8px; border: none; background: none; font-size: 0.9rem; }
        .overlay {
            position: fixed; top:0; left:0; right:0; bottom:0;
            background: rgba(20,15,8,0.75); z-index: 200;
            display: flex; align-items: center; justify-content: center;
        }
        .popup {
            background: var(--card-bg); border: 2px solid var(--border);
            border-radius: var(--radius); padding: 20px; width: 90%; max-width: 500px;
            max-height: 80vh; overflow-y: auto;
        }
        .slot-row { display: flex; align-items: center; gap: 10px; margin: 8px 0; flex-wrap: wrap; }
        .slot-row input, .slot-row select { padding: 6px; border: 1px solid var(--border); border-radius: 4px; }
        /* 红色滑块开关 */
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 28px;
        }
        .switch input { opacity:0; width:0; height:0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top:0; left:0; right:0; bottom:0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #d33; /* 红色滑块 */
        }
        .btn { padding: 8px 20px; border-radius: 20px; border: 1px solid var(--border); background: var(--gold); color: white; cursor: pointer; font-weight: bold; }
        .btn-clear { background: transparent; color: #a44; }
        .password-box { text-align: center; }
        .password-box input { padding: 10px; border: 1px solid var(--border); border-radius: 20px; text-align: center; margin: 10px 0; }
        @media (max-width: 700px) {
            .calendar-wrapper { flex: 0 0 100%; }
            .date-detail-panel { flex: 1 1 100%; }
        }
    </style>
</head>
<body>
    <!-- 背景图片层（30%透明度） -->
    <div id="bgImageLayer"></div>

    <div class="main-container">
        <!-- 头部 -->
        <div class="header"><span class="mystic">☾ ✦ ☽</span><h1>档期月历</h1></div>

        <!-- 今日大时钟 + 排期 -->
        <div class="tarot-card today-section" id="todaySection">
            <div class="today-clock-container" id="bigClockContainer">
                <canvas id="bigClockCanvas" width="280" height="280"></canvas>
            </div>
            <div class="today-schedule" id="todayScheduleList"><h3>今日排期</h3><div id="todayList"></div></div>
        </div>

        <!-- 下方日历与详情 -->
        <div class="bottom-section">
            <div class="calendar-wrapper tarot-card">
                <div class="calendar-nav" style="display:flex; justify-content:center; gap:15px; margin-bottom:10px;">
                    <button id="prevMonth">◀</button>
                    <span id="monthLabel" style="font-family:var(--font-display); font-size:1.2rem;"></span>
                    <button id="nextMonth">▶</button>
                    <button id="todayBtn">今日</button>
                </div>
                <div class="calendar-grid" id="calendarGrid"></div>
            </div>
            <div class="date-detail-panel" id="dateDetailPanel">
                <h3 style="font-family:var(--font-display); color:var(--gold-dark); margin-bottom:5px;">📅 日期排期</h3>
                <div id="selectedDateLabel" style="font-weight:bold; margin-bottom:10px; color:var(--text);"></div>
                <div id="dateDetailList">点击日历日期查看</div>
            </div>
        </div>

        <!-- 管理入口 -->
        <div class="admin-toggle" id="adminBar">
            <a id="adminEnter">🔮 管理模式</a>
            <a id="adminExit" style="display:none;">👁 展示模式</a>
            <button id="backupBtn" style="display:none;">📥备份</button>
            <button id="restoreBtn" style="display:none;">📤恢复</button>
            <button id="changeBgBtn" style="display:none;">🖼 更换背景</button>
            <button id="removeBgBtn" style="display:none;">❌ 取消背景</button>
            <input type="file" id="bgFileInput" accept="image/*" style="display:none;">
        </div>
    </div>

    <!-- 编辑弹窗 -->
    <div class="overlay" id="editOverlay" style="display:none;">
        <div class="popup">
            <h2 id="popupTitle">编辑档期</h2>
            <div id="slotEditor"></div>
            <div style="margin:15px 0; display:flex; align-items:center; justify-content:space-between;">
                <span style="font-weight:bold; color:#333;">整日报销</span>
                <label class="switch">
                    <input type="checkbox" id="reimburseSwitch">
                    <span class="slider"></span>
                </label>
            </div>
            <button class="btn" id="saveEdit">保存</button>
            <button class="btn btn-clear" id="closeEdit">取消</button>
        </div>
    </div>

    <!-- 密码弹窗 -->
    <div class="overlay" id="passwordOverlay" style="display:none;">
        <div class="popup password-box">
            <h2>🔮 管理模式</h2>
            <p style="color:var(--text-muted);">请输入管理密码</p>
            <input type="password" id="passwordInput" placeholder="••••••">
            <button class="btn" id="passwordSubmit">确认</button>
            <p id="passwordError" style="color:#c44; display:none;">密码错误</p>
        </div>
    </div>

<script>
// ==================== 云存储配置（必须修改） ====================
const JSONBIN_CONFIG = {
    binId: '6a5c59ebda38895dfe714ccb',      // 
    masterKey: '$2a$10$0xRlIBNqQmQt88Co7ffjrOpHY98x3dfgyE58VdkAW5BoDVyYRVKFe', // 
    apiUrl: 'https://api.jsonbin.io/v3/b/'
};

// ==================== 全局状态 ====================
let currentDate = new Date();
let scheduleData = {};        // { 'YYYY-MM-DD': { slots: [...], reimbursed: false }, '_bgImage': 'base64...' }
let isAdmin = false;
let editingDateKey = null;
let tempSlots = [];

const ADMIN_PASSWORD = 'photo2026';

// 颜色配置：蓝系2、金系2、紫系2
const COLOR_PALETTE = [
    '#4a90d9','#2c5aa0', // 蓝色
    '#b8963e','#d4af37', // 金色
    '#7b4b8a','#9b59b6'  // 紫色
];

// ==================== 初始化 ====================
async function init() {
    await loadFromCloud();
    applyBackground();  // 应用背景图片
    renderAll();
    setInterval(renderAll, 60000); // 每分钟刷新
}

// ==================== 背景图片功能 ====================
function applyBackground() {
    const bgDiv = document.getElementById('bgImageLayer');
    const bgData = scheduleData['_bgImage'] || null;
    if (bgData) {
        bgDiv.style.backgroundImage = `url(${bgData})`;
    } else {
        bgDiv.style.backgroundImage = 'none';
    }
}

async function handleBackgroundUpload(file) {
    const reader = new FileReader();
    reader.onload = function(e) {
        const img = new Image();
        img.onload = async function() {
            // 压缩图片至最大宽度1200px
            const canvas = document.createElement('canvas');
            const maxW = 1200;
            let w = img.width, h = img.height;
            if (w > maxW) {
                h = h * (maxW / w);
                w = maxW;
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            const base64 = canvas.toDataURL('image/jpeg', 0.6);
            scheduleData['_bgImage'] = base64;
            await saveToCloud();
            applyBackground();
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
}

async function removeBackground() {
    delete scheduleData['_bgImage'];
    await saveToCloud();
    applyBackground();
}

// ==================== 云端操作 ====================
async function loadFromCloud() {
    try {
        const res = await fetch(`${JSONBIN_CONFIG.apiUrl}${JSONBIN_CONFIG.binId}/latest`, {
            headers: { 'X-Master-Key': JSONBIN_CONFIG.masterKey }
        });
        if (res.ok) {
            const json = await res.json();
            scheduleData = json.record || {};
        }
    } catch (e) {
        console.warn('加载云端数据失败，使用本地缓存');
        const local = localStorage.getItem('schedule_backup');
        if (local) scheduleData = JSON.parse(local);
    }
}

async function saveToCloud() {
    localStorage.setItem('schedule_backup', JSON.stringify(scheduleData));
    try {
        await fetch(`${JSONBIN_CONFIG.apiUrl}${JSONBIN_CONFIG.binId}`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'X-Master-Key': JSONBIN_CONFIG.masterKey
            },
            body: JSON.stringify(scheduleData)
        });
    } catch (e) {
        alert('保存失败，请检查网络');
    }
}

// ==================== 渲染 ====================
function renderAll() {
    renderBigClock();
    renderTodaySchedule();
    renderCalendar();
    // 默认显示今天的详情，如果没有点击其他日期
    if (!editingDateKey) {
        renderDateDetail(currentDateKey());
    }
    updateAdminUI();
}

function currentDateKey(d = new Date()) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// 大时钟绘制
function renderBigClock() {
    const container = document.getElementById('bigClockContainer');
    const canvas = document.getElementById('bigClockCanvas');
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0,0,w,h);
    const cx = w/2, cy = h/2, r = Math.min(w,h)*0.42;

    const todayKey = currentDateKey();
    const dayData = scheduleData[todayKey] || { slots:[], reimbursed:false };

    // 容器透明度
    container.classList.toggle('reimbursed', dayData.reimbursed);

    // 背景圆
    ctx.beginPath();
    ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.fillStyle = '#fdfaf4';
    ctx.fill();
    ctx.strokeStyle = '#c4a66a';
    ctx.stroke();

    // 日期文字（不透明度90%）
    const today = new Date();
    ctx.font = `bold ${r*0.3}px "Cinzel Decorative"`;
    ctx.fillStyle = 'rgba(44,36,22,0.9)';
    ctx.textAlign = 'center';
    ctx.fillText(`${today.getMonth()+1}月${today.getDate()}日`, cx, cy+5);

    // 绘制时钟环
    drawClockFace(ctx, cx, cy, r, todayKey, dayData);
}

function drawClockFace(ctx, cx, cy, r, dateKey, dayData) {
    // 绘制弧线段
    if (dayData.slots) {
        dayData.slots.forEach(slot => {
            const startAngle = (slot.startHour / 24) * 2 * Math.PI - Math.PI/2;
            const endAngle = (slot.endHour / 24) * 2 * Math.PI - Math.PI/2;
            ctx.beginPath();
            ctx.arc(cx, cy, r*0.85, startAngle, endAngle);
            ctx.strokeStyle = slot.color || '#b8963e';
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.stroke();
        });
    }
    // 绘制24个图标
    for (let h = 0; h < 24; h++) {
        const angle = (h / 24) * 2 * Math.PI - Math.PI/2;
        const ix = cx + Math.cos(angle) * r*0.95;
        const iy = cy + Math.sin(angle) * r*0.95;
        ctx.font = `${r*0.15}px Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#2c2416';
        if (h === 0) ctx.fillText('★', ix, iy);
        else if (h < 12) ctx.fillText('✦', ix, iy);
        else ctx.fillText('☾', ix, iy);
    }
}

// 今日排期列表
function renderTodaySchedule() {
    const key = currentDateKey();
    const day = scheduleData[key] || {};
    const list = document.getElementById('todayList');
    if (day.reimbursed) {
        list.innerHTML = '<span class="reimbursed-badge">整日报销</span>';
    } else if (day.slots && day.slots.length) {
        list.innerHTML = day.slots.map(s => `
            <div class="slot-item" style="border-color:${s.color}">
                ${s.startHour}:00 - ${s.endHour}:00 ${s.note || ''}
            </div>`).join('');
    } else {
        list.innerHTML = '<div style="color:gray">暂无档期</div>';
    }
}

// 日历渲染
function renderCalendar() {
    const year = currentDate.getFullYear(), month = currentDate.getMonth()+1;
    document.getElementById('monthLabel').textContent = `${year}年${month}月`;
    const firstDay = new Date(year, month-1, 1).getDay();
    const daysInMonth = new Date(year, month, 0).getDate();
    const grid = document.getElementById('calendarGrid');
    grid.innerHTML = '';
    for (let i=0; i<firstDay; i++) grid.appendChild(document.createElement('div'));
    for (let d=1; d<=daysInMonth; d++) {
        const dateKey = `${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const dayData = scheduleData[dateKey] || {};
        const cell = document.createElement('div');
        cell.className = 'date-cell';
        if (dateKey === currentDateKey()) cell.classList.add('today');
        if (dayData.reimbursed) cell.classList.add('reimbursed');
        const canvas = document.createElement('canvas');
        canvas.width = 60; canvas.height = 60;
        cell.appendChild(canvas);
        const numSpan = document.createElement('span');
        numSpan.className = 'date-number';
        numSpan.textContent = d;
        cell.appendChild(numSpan);
        cell.addEventListener('click', (e) => {
            renderDateDetail(dateKey);
            if (isAdmin) openEditor(dateKey);
        });
        grid.appendChild(cell);
        // 绘制微型时钟
        const ctx = canvas.getContext('2d');
        const r = 25, cx=30, cy=30;
        ctx.clearRect(0,0,60,60);
        if (dayData.slots) {
            dayData.slots.forEach(slot => {
                const sa = (slot.startHour/24)*2*Math.PI - Math.PI/2;
                const ea = (slot.endHour/24)*2*Math.PI - Math.PI/2;
                ctx.beginPath();
                ctx.arc(cx,cy,r*0.8, sa, ea);
                ctx.strokeStyle = slot.color;
                ctx.lineWidth = 3;
                ctx.stroke();
            });
        }
        for (let h=0; h<24; h++) {
            const a = (h/24)*2*Math.PI - Math.PI/2;
            const ix = cx + Math.cos(a)*r*0.9, iy = cy + Math.sin(a)*r*0.9;
            ctx.font = '8px Arial';
            ctx.textAlign='center';
            ctx.textBaseline='middle';
            ctx.fillStyle = '#2c2416';
            if (h===0) ctx.fillText('★',ix,iy);
            else if (h<12) ctx.fillText('✦',ix,iy);
            else ctx.fillText('☾',ix,iy);
        }
    }
}

// 右侧日期详情（增加选中日期显示）
function renderDateDetail(dateKey) {
    const panel = document.getElementById('dateDetailList');
    const dateLabel = document.getElementById('selectedDateLabel');
    const parts = dateKey.split('-');
    dateLabel.textContent = `${parts[0]}年${parseInt(parts[1])}月${parseInt(parts[2])}日`;

    const day = scheduleData[dateKey] || {};
    if (day.reimbursed) {
        panel.innerHTML = '<span class="reimbursed-badge">整日报销</span>';
    } else if (day.slots && day.slots.length) {
        panel.innerHTML = day.slots.map(s => `
            <div class="slot-item" style="border-color:${s.color}">
                ${s.startHour}:00 - ${s.endHour}:00 ${s.note||''}
            </div>`).join('');
    } else {
        panel.innerHTML = '空闲';
    }
}

// ==================== 编辑器 ====================
function openEditor(dateKey) {
    editingDateKey = dateKey;
    const day = scheduleData[dateKey] || { slots:[], reimbursed:false };
    tempSlots = day.slots ? JSON.parse(JSON.stringify(day.slots)) : [];
    document.getElementById('reimburseSwitch').checked = day.reimbursed || false;
    renderSlotEditor();
    document.getElementById('editOverlay').style.display = 'flex';
    document.getElementById('popupTitle').textContent = `编辑 ${dateKey}`;
}

function renderSlotEditor() {
    const container = document.getElementById('slotEditor');
    let html = tempSlots.map((slot, idx) => `
        <div class="slot-row">
            <input type="number" min="0" max="23" value="${slot.startHour}" class="start" data-idx="${idx}" style="width:50px">时 -
            <input type="number" min="1" max="24" value="${slot.endHour}" class="end" data-idx="${idx}" style="width:50px">时
            <input type="text" placeholder="备注" value="${slot.note||''}" class="note" data-idx="${idx}">
            <button onclick="removeSlot(${idx})">✕</button>
        </div>`).join('');
    html += '<button onclick="addSlot()" style="margin-top:8px;">+ 添加时间段</button>';
    container.innerHTML = html;
}

window.addSlot = function() {
    tempSlots.push({ startHour: 8, endHour: 12, note: '', color: getRandomColor() });
    renderSlotEditor();
};
window.removeSlot = function(idx) {
    tempSlots.splice(idx,1);
    renderSlotEditor();
};

function getRandomColor() {
    return COLOR_PALETTE[Math.floor(Math.random() * COLOR_PALETTE.length)];
}

document.getElementById('saveEdit').addEventListener('click', async () => {
    const startInputs = document.querySelectorAll('.start');
    const endInputs = document.querySelectorAll('.end');
    const noteInputs = document.querySelectorAll('.note');
    const newSlots = [];
    for (let i=0; i<startInputs.length; i++) {
        const start = parseInt(startInputs[i].value);
        const end = parseInt(endInputs[i].value);
        if (start < end && start >=0 && end <=24) {
            newSlots.push({
                startHour: start,
                endHour: end,
                note: noteInputs[i].value,
                color: tempSlots[i]?.color || getRandomColor()
            });
        }
    }
    // 合并连续同颜色同备注的相邻时间段
    const merged = [];
    for (const slot of newSlots.sort((a,b)=>a.startHour-b.startHour)) {
        const last = merged[merged.length-1];
        if (last && last.endHour === slot.startHour && last.color === slot.color && last.note === slot.note) {
            last.endHour = slot.endHour;
        } else {
            merged.push(slot);
        }
    }
    scheduleData[editingDateKey] = {
        slots: merged,
        reimbursed: document.getElementById('reimburseSwitch').checked
    };
    await saveToCloud();
    document.getElementById('editOverlay').style.display = 'none';
    renderAll();
});

document.getElementById('closeEdit').addEventListener('click', ()=>{
    document.getElementById('editOverlay').style.display = 'none';
});

// ==================== 管理权限 ====================
document.getElementById('adminEnter').addEventListener('click', ()=>{
    document.getElementById('passwordOverlay').style.display = 'flex';
    document.getElementById('passwordInput').value = '';
    document.getElementById('passwordError').style.display = 'none';
    setTimeout(()=> document.getElementById('passwordInput').focus(), 100);
});

document.getElementById('passwordSubmit').addEventListener('click', ()=>{
    if (document.getElementById('passwordInput').value === ADMIN_PASSWORD) {
        isAdmin = true;
        document.getElementById('passwordOverlay').style.display = 'none';
        renderAll();
    } else {
        document.getElementById('passwordError').style.display = 'block';
        document.getElementById('passwordInput').value = '';
        document.getElementById('passwordInput').focus();
    }
});

document.getElementById('adminExit').addEventListener('click', ()=>{
    isAdmin = false;
    renderAll();
});

function updateAdminUI() {
    const enter = document.getElementById('adminEnter');
    const exit = document.getElementById('adminExit');
    const backup = document.getElementById('backupBtn');
    const restore = document.getElementById('restoreBtn');
    const changeBg = document.getElementById('changeBgBtn');
    const removeBg = document.getElementById('removeBgBtn');
    if (isAdmin) {
        enter.style.display = 'none';
        exit.style.display = 'inline';
        backup.style.display = 'inline';
        restore.style.display = 'inline';
        changeBg.style.display = 'inline';
        removeBg.style.display = 'inline';
    } else {
        enter.style.display = 'inline';
        exit.style.display = 'none';
        backup.style.display = 'none';
        restore.style.display = 'none';
        changeBg.style.display = 'none';
        removeBg.style.display = 'none';
    }
}

// 备份恢复
document.getElementById('backupBtn').addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify(scheduleData)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'schedule_backup.json';
    a.click();
});
document.getElementById('restoreBtn').addEventListener('click', ()=>{
    const input = document.createElement('input');
    input.type='file';
    input.accept='.json';
    input.onchange = async (e) => {
        const file = e.target.files[0];
        const text = await file.text();
        try {
            scheduleData = JSON.parse(text);
            await saveToCloud();
            applyBackground();
            renderAll();
            alert('数据已恢复并同步到云端');
        } catch (err) {
            alert('文件格式错误');
        }
    };
    input.click();
});

// 背景图片上传
document.getElementById('changeBgBtn').addEventListener('click', ()=>{
    document.getElementById('bgFileInput').click();
});
document.getElementById('bgFileInput').addEventListener('change', (e)=>{
    if (e.target.files && e.target.files[0]) {
        handleBackgroundUpload(e.target.files[0]);
    }
});
document.getElementById('removeBgBtn').addEventListener('click', ()=>{
    if (confirm('确定要取消背景图片，恢复纯色背景吗？')) {
        removeBackground();
    }
});

// 月份切换
document.getElementById('prevMonth').addEventListener('click', ()=>{
    currentDate.setMonth(currentDate.getMonth()-1);
    renderAll();
});
document.getElementById('nextMonth').addEventListener('click', ()=>{
    currentDate.setMonth(currentDate.getMonth()+1);
    renderAll();
});
document.getElementById('todayBtn').addEventListener('click', ()=>{
    currentDate=new Date();
    renderAll();
});

// 关闭密码弹窗（点击背景）
document.getElementById('passwordOverlay').addEventListener('click', function(e){
    if (e.target === this) this.style.display = 'none';
});

// 启动
init();
</script>
</body>
</html>
